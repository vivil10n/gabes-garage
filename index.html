<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gabe's garage</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>gabe's garage</h1>
    <p>click a car :)</p>
  </header>

  <main class="garage">
    <button class="car slot1" data-name="Aurelius" data-number="01" data-message="MESSAGE">
      <img src="images/aurelius.png" alt="Aurelius' car">
    </button>
    <button class="car slot2" data-name="Cindy" data-number="02" data-message="MESSAGE">
      <img src="images/cindy.png" alt="Cindy's car">
    </button>
    <button class="car slot3" data-name="Carlo" data-number="03" data-message="MESSAGE">
      <img src="images/carlo.png" alt="Carlo's car">
    </button>
    <button class="car slot4" data-name="Ren + Danny" data-number="04" data-message="MESSAGE">
      <img src="images/ren_danny.png" alt="Ren and Danny's car">
    </button>
    <button class="car slot5" data-name="Sameer" data-number="05" data-message="MESSAGE">
      <img src="images/sameer.png" alt="Sameer's car">
    </button>
    <button class="car slot6" data-name="Aaliyah" data-number="06" data-message="MESSAGE">
      <img src="images/aaliyah.png" alt="Aaliyah's car">
    </button>
    <button class="car pair slot7" data-name="Alicia + Michael" data-number="07" data-message="MESSAGE">
      <div class="paircars">
        <img src="images/alicia.png" alt="Alicia's car">
        <img src="images/michael.png" alt="Michael's car">
      </div>
    </button>
    <button class="car slot8" data-name="Jordan" data-number="08" data-message="MESSAGE">
      <img src="images/jordan.png" alt="Jordan's car">
    </button>
    <button class="car slot9" data-name="Monica" data-number="09" data-message="MESSAGE">
      <img src="images/monica.png" alt="Monica's car">
    </button>
    <button class="car pair slot10" data-name="Ivy + Khaled" data-number="10" data-message="MESSAGE">
      <div class="paircars">
        <img src="images/ivy.png" alt="Ivy's car">
        <img src="images/khaled.png" alt="Khaled's car">
      </div>
    </button>
    <button class="car slot11" data-name="Tyrone" data-number="11" data-message="MESSAGE">
      <img src="images/tyrone.png" alt="Tyrone's car">
    </button>
    <button class="car slot12" data-name="Lance" data-number="12" data-message="MESSAGE">
      <img src="images/lance.png" alt="Lance's car">
    </button>
    <button class="car slot13" data-name="Sebastian + Joselyn" data-number="13" data-message="MESSAGE">
      <img src="images/sebastian_joselyn.png" alt="Sebastian and Joselyn's car">
    </button>
    <button class="car slot14" data-name="Tayla" data-number="14" data-message="MESSAGE">
      <img src="images/tayla.png" alt="Tayla's car">
    </button>
    <button class="car slot15" data-name="Katelyn" data-number="15" data-message="MESSAGE">
      <img src="images/katelyn.png" alt="Katelyn's car">
    </button>

  </main>
  <div class="overlay" id="overlay">
    <div class="keychain">
      <div class="ring"></div>

      <div class="tag">
        <p class="smalltitle">GABE'S GARAGE</p>
        <h2 id="key-number">KEY 01</h2>

        <p id="message">MESSAGE</p>

        <div class="from" id="from"></div>
      </div>
    </div>
  </div>
  
  <script src="script.js"></script>

</body>
</html>
